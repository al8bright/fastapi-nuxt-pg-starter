# pnpm 11 : 의존성 빌드 스크립트 허용 (네이티브 바이너리 링크).
# 없으면 'pnpm install' 이 ERR_PNPM_IGNORED_BUILDS 로 비정상 종료한다.
#
# ⚠️ pnpm 11 에서 키가 바뀌었다. pnpm 10 의 리스트형 onlyBuiltDependencies 는 더 이상 인식되지 않고,
#    pnpm 이 이 파일에 allowBuilds 맵을 자동으로 끼워 넣는다(= 템플릿 오염). 처음부터 allowBuilds 로 둔다.
#
# Nuxt 4 + Tailwind v4 조합에서 실제로 postinstall 을 도는 것은 아래 두 개다.
# (@tailwindcss/oxide 는 optionalDependencies 로 미리 빌드되어 오므로 목록에 없어도 된다)
allowBuilds:
  esbuild: true
  unrs-resolver: true
